<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.instagram.com https://*.cdninstagram.com https://*.fbcdn.net; img-src 'self' data: https://*.ytimg.com https://*.ggpht.com https://i.ytimg.com https://*.cdninstagram.com https://*.fbcdn.net https://*.tiktokcdn.com https://*.tiktokcdn-us.com; style-src 'self' 'unsafe-inline'; font-src 'self';">
  <title>DL Buddy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <!-- Download Queue (fixed top-right) -->
    <div class="queue-anchor">
      <button id="queueBtn" class="queue-btn" aria-label="Downloads">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span id="queueBadge" class="queue-badge"></span>
      </button>
      <div id="queuePanel" class="queue-panel">
        <div class="queue-panel__header">
          <span class="queue-panel__title">Downloads</span>
          <button id="queueClearDone" class="queue-panel__clear" style="display:none">Clear Done</button>
        </div>
        <div id="queueList" class="queue-panel__list"></div>
        <div id="queueEmpty" class="queue-panel__empty visible">
          <div class="queue-panel__empty-icon">😢</div>
          <div class="queue-panel__empty-text">No downloads yet fam, go and steal some videos already</div>
        </div>
      </div>
    </div>
    <div id="queueBackdrop" class="queue-backdrop"></div>

    <!-- Spacer top -->
    <div class="spacer"></div>

    <!-- Meme Sticker -->
    <img id="memeSticker" src="stickers/Default.png" class="sticker" alt="" draggable="false">

    <!-- Path Display (clickable, right-aligned) -->
    <div id="pathDisplay" class="path-display" title="">~/Downloads/YT Clips</div>

    <!-- Unified URL + Download row -->
    <div class="url-row">
      <input
        type="text"
        id="urlInput"
        class="url-input"
        placeholder="Hurry up and paste a link, my ninja"
        spellcheck="false"
        autocomplete="off"
      >
      <button id="urlClear" class="url-input-clear" aria-label="Clear URL">✕</button>
      <button id="downloadBtn" class="btn-download" disabled>Download This Shit</button>
      <div id="btnHint" class="btn-hint"></div>
    </div>
    <div id="urlHint" class="url-hint"></div>

    <!-- Controls row: time range (left) + quality selector (right) -->
    <div class="controls-row">
      <div class="clip-range">
        <input type="text" id="startTime" class="time-input" placeholder="00:00:00" value="00:00:00" disabled>
        <span class="clip-range__separator">to</span>
        <input type="text" id="endTime" class="time-input" placeholder="00:00:00" value="00:00:00" disabled>
      </div>
      <div id="qualitySelector" class="quality-bar">
        <div class="pill-indicator" id="pillIndicator"></div>
        <button class="quality-option active" data-quality="best">Best / 4K</button>
        <button class="quality-option" data-quality="hd">HD 1080p</button>
        <button class="quality-option" data-quality="audio">Audio Only</button>
      </div>
    </div>

    <!-- Video Info Card (below controls) -->
    <div id="videoCard" class="video-card">
      <div id="videoThumbWrap" class="video-card__thumb-wrap">
        <img id="videoThumb" class="video-card__thumb" alt="">
      </div>
      <div class="video-card__info">
        <div id="videoTitle" class="video-card__title"></div>
        <div id="videoMeta" class="video-card__meta"></div>
        <div id="videoQualities" class="video-card__qualities"></div>
      </div>
    </div>

    <!-- Carousel Picker (Instagram multi-image posts) -->
    <div id="carouselCard" class="carousel-card">
      <div class="carousel-card__header">
        <span id="carouselTitle" class="carousel-card__title"></span>
        <button id="carouselSelectAll" class="carousel-card__select-all">Select All</button>
      </div>
      <div id="carouselGrid" class="carousel-card__grid"></div>
      <div class="carousel-card__footer">
        <span id="carouselCount" class="carousel-card__count"></span>
      </div>
    </div>

    <!-- Spacer bottom -->
    <div class="spacer"></div>

    <!-- Settings backdrop (covers drag region for click-outside dismiss) -->
    <div id="settingsBackdrop" class="settings-backdrop"></div>

    <!-- Settings gear (fixed bottom-left) -->
    <div class="settings-anchor">
      <button id="settingsBtn" class="settings-btn" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
          <path d="M10 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16.167 12.5a1.375 1.375 0 00.275 1.517l.05.05a1.667 1.667 0 11-2.359 2.358l-.05-.05a1.375 1.375 0 00-1.516-.275 1.375 1.375 0 00-.834 1.258v.142a1.667 1.667 0 11-3.333 0v-.075a1.375 1.375 0 00-.9-1.258 1.375 1.375 0 00-1.517.275l-.05.05a1.667 1.667 0 11-2.358-2.359l.05-.05a1.375 1.375 0 00.275-1.516 1.375 1.375 0 00-1.258-.834h-.142a1.667 1.667 0 010-3.333h.075a1.375 1.375 0 001.258-.9 1.375 1.375 0 00-.275-1.517l-.05-.05A1.667 1.667 0 115.892 3.508l.05.05a1.375 1.375 0 001.516.275h.067a1.375 1.375 0 00.833-1.258v-.142a1.667 1.667 0 013.334 0v.075a1.375 1.375 0 00.833 1.258 1.375 1.375 0 001.517-.275l.05-.05a1.667 1.667 0 112.358 2.359l-.05.05a1.375 1.375 0 00-.275 1.516v.067a1.375 1.375 0 001.258.833h.142a1.667 1.667 0 010 3.334h-.075a1.375 1.375 0 00-1.258.833z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div id="settingsPopover" class="settings-popover">
        <div class="settings-row">
          <span class="settings-label">Auto-paste</span>
          <button id="autoPasteToggle" class="toggle" aria-label="Toggle auto-paste">
            <span class="toggle__knob"></span>
          </button>
        </div>
        <div class="settings-row">
          <span class="settings-label">Show in Finder</span>
          <button id="showInFinderToggle" class="toggle" aria-label="Toggle show in Finder">
            <span class="toggle__knob"></span>
          </button>
        </div>
        <button id="historyBtn" class="settings-action-btn">History</button>
        <div class="settings-divider"></div>
        <button id="appUpdateBtn" class="settings-action-btn settings-app-update" style="display:none">Update Available</button>
        <div class="settings-row">
          <button id="updateYtdlpBtn" class="settings-update-btn">Update</button>
          <span id="appVersion" class="settings-version"></span>
        </div>
      </div>
    </div>

    <!-- Logo (fixed bottom-right) -->
    <div class="logo-anchor">
      <img src="logo-text.svg" alt="DL Buddy" class="logo-text" draggable="false">
    </div>

    <!-- Drag & Drop Overlay -->
    <div id="dropOverlay" class="drop-overlay">
      <div class="drop-overlay__content">Drop a link here</div>
    </div>

  </div>

  <!-- Status Toast (fixed center-top, outside .app) -->
  <div id="statusMessage" class="status-message">
    <span class="status-message__icon" id="statusIcon"></span>
    <span class="status-message__text" id="statusText"></span>
    <button id="statusCopy" class="status-copy-btn">Copy</button>
    <button id="statusRetry" class="status-retry-btn" style="display:none">Retry</button>
  </div>

  <!-- History View (full-screen overlay, outside .app) -->
  <div id="historyView" class="history-view">
    <div class="history-header">
      <button id="historyBack" class="history-back" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
          <path d="M12.5 15l-5-5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="history-title">Download History</span>
      <button id="historyClearBtn" class="history-clear-btn">Clear All</button>
    </div>

    <div class="history-toolbar">
      <div class="history-search-wrap">
        <input type="text" id="historySearch" class="history-search" placeholder="Search title, channel, URL..." spellcheck="false" autocomplete="off">
      </div>
      <div class="history-filters">
        <button class="history-filter active" data-filter="all">All</button>
        <button class="history-filter" data-filter="video">Video</button>
        <button class="history-filter" data-filter="audio">Audio</button>
        <button class="history-filter" data-filter="image">Image</button>
      </div>
    </div>

    <div class="history-sort-row">
      <span id="historyCount" class="history-count">0 downloads</span>
      <button id="historySortBtn" class="history-sort-btn" data-sort="newest">Newest first</button>
    </div>

    <div id="historyList" class="history-list"></div>

    <div id="historyEmpty" class="history-empty">
      <span>No downloads yet. Go download something.</span>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
