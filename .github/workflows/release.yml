name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Verify release identity and architecture
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
          test "$(node -p "process.arch")" = "arm64"
          test "$(node -p "require('./bin/runtime-manifest.json').architecture")" = "arm64"

      - name: Verify release inputs
        run: npm run verify

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: Sign bundled runtime binaries
        run: node scripts/sign-bundled-runtimes.js

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run publish

      - name: Verify signed app and YouTube runtime
        run: |
          APP_PATH="out/Downroad-darwin-arm64/Downroad.app"
          RESOURCES="$APP_PATH/Contents/Resources"
          test -d "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$RESOURCES/deno"
          "$RESOURCES/deno" --version
          codesign --verify --strict --verbose=2 "$RESOURCES/yt-dlp_macos"
          "$RESOURCES/yt-dlp_macos" --js-runtimes "deno:$RESOURCES/deno" --simulate --no-playlist \
            "https://www.youtube.com/watch?v=BaW_jenozKc"

      - name: Make release live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v$(node -p "require('./package.json').version")"
          gh release edit "$RELEASE_TAG" --draft=false
