name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Verify release identity and architecture
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
          test "$(node -p "process.arch")" = "arm64"
          test "$(node -p "require('./bin/runtime-manifest.json').architecture")" = "arm64"

      - name: Verify release inputs
        run: npm run verify

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: Sign bundled runtime binaries
        run: node scripts/sign-bundled-runtimes.js

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run publish

      - name: Verify signed app and YouTube runtime
        run: |
          APP_PATH="out/Downroad-darwin-arm64/Downroad.app"
          RESOURCES="$APP_PATH/Contents/Resources"
          test -d "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$RESOURCES/deno"
          "$RESOURCES/deno" --version
          codesign --verify --strict --verbose=2 "$RESOURCES/bgutil-pot"
          "$RESOURCES/bgutil-pot" --version
          test -f "$RESOURCES/yt-dlp-plugins/bgutil-ytdlp-pot-provider-rs.zip"
          codesign --verify --strict --verbose=2 "$RESOURCES/yt-dlp_macos"
          "$RESOURCES/yt-dlp_macos" --js-runtimes "deno:$RESOURCES/deno" --simulate --no-playlist \
            "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
          "$RESOURCES/bgutil-pot" server --host 127.0.0.1 --port 44167 > /tmp/downroad-pot.log 2>&1 &
          POT_PID=$!
          trap 'kill "$POT_PID" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            curl --fail --silent http://127.0.0.1:44167/ping && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:44167/ping
          "$RESOURCES/yt-dlp_macos" \
            --plugin-dirs "$RESOURCES/yt-dlp-plugins" \
            --extractor-args "youtube:player_client=mweb" \
            --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:44167" \
            --js-runtimes "deno:$RESOURCES/deno" \
            --simulate --no-playlist "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
          kill "$POT_PID"
          wait "$POT_PID" || true
          trap - EXIT

      - name: Make release live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v$(node -p "require('./package.json').version")"
          DRAFT_TAG=$(gh release list --limit 10 --json tagName,isDraft,name \
            --jq ".[] | select(.isDraft == true and .name == \"$RELEASE_TAG\") | .tagName" -r | head -1)
          if [ -n "$DRAFT_TAG" ]; then
            gh release edit "$DRAFT_TAG" --tag "$RELEASE_TAG" --draft=false
          else
            gh release edit "$RELEASE_TAG" --draft=false
          fi
